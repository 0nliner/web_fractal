[project]
name = "anki-example"
version = "0.1.0"
description = "Anki clone — web_fractal example app"
requires-python = ">=3.12"
dependencies = [
    "web_fractal",
    "fastapi>=0.100",
    "uvicorn>=0.27",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
